
name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  detect-secrets:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"
      - run: |
          detect-secrets scan --update .secrets.baseline
          detect-secrets -v audit --report --fail-on-unaudited --fail-on-live --fail-on-audited-real .secrets.baseline

  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: build-test (go v${{ matrix.go-version }})
    needs: detect-secrets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go v${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Print Go env
        run: |
          go version
          if [ -f go.mod ]; then echo "go.mod target:"; grep '^go ' go.mod || true; fi

      # Install a modern golangci-lint via the official action on the 1.25 job only
      - name: Run golangci-lint (Go 1.25 only)
        if: matrix.go-version == '1.25'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --build-tags=integration,examples
          skip-cache: true

      # (Optional) Confirm version before Makefile guard
      - name: Show golangci-lint version (if installed)
        run: |
          command -v golangci-lint && golangci-lint version || true

      - name: Install developer tools
        run: |
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Build/Test Project
        env:
          # Ensure Makefile guard expects 1.25 when lint runs
          LINT_MIN_GO: 1.25
        run: make travis-ci

  publish-release:
    if: github.ref_name == 'main' && github.event_name != 'pull_request' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: build
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install bump-my-version
          npm install
      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run semantic-release
